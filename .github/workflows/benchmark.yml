name: Benchmark
on:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Specific SDK version (empty = latest nightly)'
        required: false
        default: ''
        type: string
      sdk_channel:
        description: '.NET SDK channel'
        required: false
        default: '11.0'
        type: string
      runtime_commit:
        description: 'Specific dotnet/runtime commit hash to benchmark (patches SDK with matching runtime pack)'
        required: false
        default: ''
        type: string
      runtime_pack:
        description: 'Specific runtime pack version (e.g. 11.0.0-preview.3.26153.109)'
        required: false
        default: ''
        type: string
      runtime_repo:
        description: 'GitHub repo for runtime fork (e.g. user/runtime). Default: dotnet/runtime'
        required: false
        default: ''
        type: string
      runtime_pr:
        description: 'dotnet/runtime PR number — auto-resolves fork repo and head commit'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (run benchmarks but do not publish results)'
        required: false
        default: false
        type: boolean

# Set the CONTAINER_REGISTRY repository variable to ghcr.io/<owner>/<repo> (lowercase).
# Example: ghcr.io/blazor-playground/macro-benchmarks

jobs:
  # ── Job 1: Resolve SDK version ─────────────────────────────────────────────
  resolve:
    name: Resolve (${{ inputs.sdk_version || 'latest' }})
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY }}/browser-bench-build:latest
    permissions:
      contents: write
      packages: read
    timeout-minutes: 15
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.sdk-version }}
      runtime-commit-date: ${{ steps.sdk-version.outputs.runtime-commit-date }}
      runtime-commit-message: ${{ steps.sdk-version.outputs.runtime-commit-message }}
      runtime-build-required: ${{ steps.sdk-version.outputs.runtime-build-required }}
      runtime-commit: ${{ steps.sdk-version.outputs.runtime-commit }}
      runtime-repo: ${{ steps.sdk-version.outputs.runtime-repo }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Resolve SDK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages check-out-tracking,enumerate-daily-packs,enumerate-release-packs,update-cache,resolve-sdk \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            --sdk-channel "${{ inputs.sdk_channel || '11.0' }}" \
            ${{ inputs.sdk_version && format('--sdk-version "{0}"', inputs.sdk_version) || '' }} \
            ${{ inputs.runtime_commit && format('--runtime-commit "{0}"', inputs.runtime_commit) || '' }} \
            ${{ inputs.runtime_pack && format('--runtime-pack "{0}"', inputs.runtime_pack) || '' }} \
            ${{ inputs.runtime_pr && format('--runtime-pr "{0}"', inputs.runtime_pr) || '' }} \
            ${{ inputs.runtime_repo && format('--runtime-repo "{0}"', inputs.runtime_repo) || '' }} \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}

      - name: Read SDK version
        id: sdk-version
        shell: bash
        run: |
          SDK_VERSION=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.sdkInfo?.sdkVersion || '')")
          COMMIT_DATE=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.sdkInfo?.runtimeCommitDateTime?.split('T')[0] || '')")
          COMMIT_MSG=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); const m=c.sdkInfo?.runtimeCommitMessage||''; console.log(m.length>60?m.slice(0,60)+'…':m)")
          RUNTIME_BUILD=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.runtimeBuildRequired ? 'true' : 'false')")
          RUNTIME_COMMIT=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.runtimeCommit || '')")
          RUNTIME_REPO=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.runtimeRepo || 'dotnet/runtime')")
          echo "sdk-version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "runtime-commit-date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"
          echo "runtime-commit-message=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "runtime-build-required=$RUNTIME_BUILD" >> "$GITHUB_OUTPUT"
          echo "runtime-commit=$RUNTIME_COMMIT" >> "$GITHUB_OUTPUT"
          echo "runtime-repo=$RUNTIME_REPO" >> "$GITHUB_OUTPUT"
          echo "SDK version: $SDK_VERSION" >&2
          echo "Runtime commit: $COMMIT_DATE $COMMIT_MSG" >&2
          echo "Runtime build required: $RUNTIME_BUILD" >&2

      - name: Upload bench context
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}/bench-context.json
          if-no-files-found: error
          retention-days: 7

  # ── Job 2a: Build Runtime Mono (only when building from source) ─────────────
  build-runtime-mono:
    name: Build Runtime (Mono)
    needs: resolve
    if: needs.resolve.outputs.runtime-build-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Clone runtime repo
        shell: bash
        run: |
          git clone --no-checkout --filter=blob:none \
            "https://github.com/${{ needs.resolve.outputs.runtime-repo }}.git" runtime-src
          cd runtime-src
          git checkout ${{ needs.resolve.outputs.runtime-commit }}

      - name: Build Mono browser-wasm
        shell: bash
        run: |
          cd runtime-src
          ./build.sh mono+libs -os browser -arch wasm -c Release
          ./build.sh libs.packs -os browser -arch wasm -c Release

      - name: Find and extract runtime pack
        id: pack
        shell: bash
        run: |
          NUPKG=$(find runtime-src/artifacts/packages/Release/Shipping \
            -iname 'Microsoft.NETCore.App.Runtime.Mono.browser-wasm.*.nupkg' \
            -print -quit 2>/dev/null || true)
          if [ -z "$NUPKG" ]; then
            NUPKG=$(find runtime-src/artifacts/packages/Release/NonShipping \
              -iname 'Microsoft.NETCore.App.Runtime.Mono.browser-wasm.*.nupkg' \
              -print -quit 2>/dev/null || true)
          fi
          if [ -z "$NUPKG" ]; then
            echo "ERROR: Mono runtime pack nupkg not found" >&2
            exit 1
          fi
          echo "Found nupkg: $NUPKG" >&2
          mkdir -p runtime-pack-mono
          unzip -o "$NUPKG" -d runtime-pack-mono

      - name: Upload runtime pack
        uses: actions/upload-artifact@v7
        with:
          name: runtime-pack-mono
          path: runtime-pack-mono/
          retention-days: 3

  # ── Job 2b: Build Runtime CoreCLR (only when building from source) ─────────
  build-runtime-coreclr:
    name: Build Runtime (CoreCLR)
    needs: resolve
    if: needs.resolve.outputs.runtime-build-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Clone runtime repo
        shell: bash
        run: |
          git clone --no-checkout --filter=blob:none \
            "https://github.com/${{ needs.resolve.outputs.runtime-repo }}.git" runtime-src
          cd runtime-src
          git checkout ${{ needs.resolve.outputs.runtime-commit }}

      - name: Build CoreCLR browser-wasm
        shell: bash
        run: |
          cd runtime-src
          ./build.sh clr+libs -os browser -arch wasm -c Release
          ./build.sh libs.packs -os browser -arch wasm -c Release

      - name: Find and extract runtime pack
        id: pack
        shell: bash
        run: |
          NUPKG=$(find runtime-src/artifacts/packages/Release/Shipping \
            -iname 'Microsoft.NETCore.App.Runtime.browser-wasm.*.nupkg' \
            ! -iname '*Mono*' \
            -print -quit 2>/dev/null || true)
          if [ -z "$NUPKG" ]; then
            NUPKG=$(find runtime-src/artifacts/packages/Release/NonShipping \
              -iname 'Microsoft.NETCore.App.Runtime.browser-wasm.*.nupkg' \
              ! -iname '*Mono*' \
              -print -quit 2>/dev/null || true)
          fi
          if [ -z "$NUPKG" ]; then
            echo "ERROR: CoreCLR runtime pack nupkg not found" >&2
            exit 1
          fi
          echo "Found nupkg: $NUPKG" >&2
          mkdir -p runtime-pack-coreclr
          unzip -o "$NUPKG" -d runtime-pack-coreclr

      - name: Upload runtime pack
        uses: actions/upload-artifact@v7
        with:
          name: runtime-pack-coreclr
          path: runtime-pack-coreclr/
          retention-days: 3

  # ── Job 3: Build all apps ──────────────────────────────────────────────────
  build:
    name: Build (${{ needs.resolve.outputs.sdk-version }}, ${{ needs.resolve.outputs.runtime-commit-date }}, ${{ needs.resolve.outputs.runtime-commit-message }})
    needs: [resolve, build-runtime-mono, build-runtime-coreclr]
    if: |
      always()
      && needs.resolve.result == 'success'
      && (needs.build-runtime-mono.result == 'success' || needs.build-runtime-mono.result == 'skipped')
      && (needs.build-runtime-coreclr.result == 'success' || needs.build-runtime-coreclr.result == 'skipped')
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY }}/browser-bench-build:latest
    permissions:
      contents: write
      packages: read
    timeout-minutes: 180
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download Mono runtime pack (if built from source)
        if: needs.resolve.outputs.runtime-build-required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: runtime-pack-mono
          path: ${{ env.ARTIFACTS_DIR }}/runtime-pack-mono

      - name: Download CoreCLR runtime pack (if built from source)
        if: needs.resolve.outputs.runtime-build-required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: runtime-pack-coreclr
          path: ${{ env.ARTIFACTS_DIR }}/runtime-pack-coreclr

      - name: Build all apps
        shell: bash
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages check-out-tracking,download-sdk,build-runtime,build \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}

      - name: Read run ID
        id: run-id
        shell: bash
        run: |
          RUN_ID=$(cat "${ARTIFACTS_DIR}/results/.run-id")
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Run ID: $RUN_ID" >&2

      - name: Set matrix output
        id: matrix
        shell: bash
        run: |
          MANIFEST="${ARTIFACTS_DIR}/results/${{ steps.run-id.outputs.run-id }}/build-manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "⚠ No build manifest found" >&2
            exit 0
          fi
          # Extract {app, preset, runtime} for the GHA matrix
          MATRIX=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const m = JSON.parse(readFileSync('$MANIFEST', 'utf-8'));
            console.log(JSON.stringify(m.map(e => ({ app: e.app, preset: e.preset, runtime: e.runtime }))));
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $MATRIX" >&2

      - name: Upload bench context
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}/bench-context.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-results
          path: ${{ env.ARTIFACTS_DIR }}/results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload all builds
        uses: actions/upload-artifact@v7
        if: always() && steps.matrix.outputs.matrix != '[]'
        with:
          name: all-builds
          path: ${{ env.ARTIFACTS_DIR }}/publish/
          if-no-files-found: error
          retention-days: 3

  # ── Job 3: Measure (matrix: app × preset, all engines per job) ─────────────
  measure:
    name: Measure ${{ matrix.app }}/${{ matrix.preset }}/${{ matrix.runtime }}
    needs: [resolve, build]
    if: needs.build.outputs.matrix != '[]' && needs.build.outputs.matrix != ''
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CONTAINER_REGISTRY }}/browser-bench-measure:latest
      options: --user 1001
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Symlink pre-installed node_modules into workspace
        shell: bash
        run: entrypoint.sh true

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: build-results
          path: ${{ env.ARTIFACTS_DIR }}/results

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: all-builds
          path: ${{ env.ARTIFACTS_DIR }}/publish

      - name: Run measurements
        shell: bash
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages measure \
            --verbose \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            --app "${{ matrix.app }}" \
            --preset "${{ matrix.preset }}" \
            --runtime "${{ matrix.runtime }}" \
            --retries 3 \
            --timeout 600000 \
            --deadline-minutes 55 \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.app }}-${{ matrix.preset }}-${{ matrix.runtime }}
          path: ${{ env.ARTIFACTS_DIR }}/results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 3: Aggregate results and update views ──────────────────────────────
  aggregate:
    name: Aggregate
    needs: [resolve, build, measure]
    if: always() && needs.measure.result == 'success'
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY }}/browser-bench-build:latest
    permissions:
      contents: write
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Symlink pre-installed node_modules into workspace
        shell: bash
        run: entrypoint.sh true

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download build results
        uses: actions/download-artifact@v8
        with:
          name: build-results
          path: ${{ env.ARTIFACTS_DIR }}/results

      - name: Download all measurement results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: ${{ env.ARTIFACTS_DIR }}/results
          merge-multiple: true

      - name: List collected results
        shell: bash
        run: find "${ARTIFACTS_DIR}/results" -name '*.json' | head -150 || true

      - name: Transform and update views
        shell: bash
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages transform-views,update-views \
            --verbose \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}

      - name: Upload final results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-results
          path: ${{ env.ARTIFACTS_DIR }}/results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 5: Schedule untested SDK versions ──────────────────────────────────
  schedule:
    name: Schedule
    needs: [resolve, aggregate]
    if: always() && needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY }}/browser-bench-build:latest
    permissions:
      contents: write
      actions: write
      packages: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Symlink pre-installed node_modules into workspace
        shell: bash
        run: entrypoint.sh true

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Run schedule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages check-out-tracking,schedule \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}
