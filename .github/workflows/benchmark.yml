name: Benchmark
on:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Specific SDK version (empty = latest nightly)'
        required: false
        default: ''
        type: string
      sdk_channel:
        description: '.NET SDK channel'
        required: false
        default: '12.0'
        type: string
      runtime_commit:
        description: 'Specific dotnet/runtime commit hash to benchmark (patches SDK with matching runtime pack)'
        required: false
        default: ''
        type: string
      runtime_pack:
        description: 'Specific runtime pack version (e.g. 12.0.0-alpha.1.26459.112)'
        required: false
        default: ''
        type: string
      runtime_repo:
        description: 'GitHub repo for runtime fork (e.g. user/runtime). Default: dotnet/runtime'
        required: false
        default: ''
        type: string
      runtime_pr:
        description: 'dotnet/runtime PR number — auto-resolves fork repo and head commit'
        required: false
        default: ''
        type: string
      aspnetcore_commit:
        description: 'Specific dotnet/aspnetcore commit hash (builds from source)'
        required: false
        default: ''
        type: string
      aspnetcore_pr:
        description: 'dotnet/aspnetcore PR number — auto-resolves fork repo and head commit'
        required: false
        default: ''
        type: string
      aspnetcore_repo:
        description: 'GitHub repo for aspnetcore fork (e.g. user/aspnetcore). Default: dotnet/aspnetcore'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (run benchmarks but do not publish results)'
        required: false
        default: false
        type: boolean

# Set the CONTAINER_REGISTRY repository variable to ghcr.io/<owner>/<repo> (lowercase).
# Example: ghcr.io/blazor-playground/macro-benchmarks

jobs:
  # ── Job 1: Resolve SDK version ─────────────────────────────────────────────
  resolve:
    name: Resolve (${{ inputs.sdk_version || 'latest' }})
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io/blazor-playground/macro-benchmarks' }}/browser-bench-build:latest
    permissions:
      contents: write
      packages: read
    timeout-minutes: 15
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.sdk-version }}
      runtime-commit-date: ${{ steps.sdk-version.outputs.runtime-commit-date }}
      runtime-commit-message: ${{ steps.sdk-version.outputs.runtime-commit-message }}
      runtime-build-required: ${{ steps.sdk-version.outputs.runtime-build-required }}
      runtime-commit: ${{ steps.sdk-version.outputs.runtime-commit }}
      runtime-repo: ${{ steps.sdk-version.outputs.runtime-repo }}
      aspnetcore-build-required: ${{ steps.sdk-version.outputs.aspnetcore-build-required }}
      aspnetcore-commit: ${{ steps.sdk-version.outputs.aspnetcore-commit }}
      aspnetcore-repo: ${{ steps.sdk-version.outputs.aspnetcore-repo }}
      apps: ${{ steps.plan.outputs.apps }}
      build-run-id: ${{ steps.plan.outputs.build-run-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Resolve SDK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages check-out-tracking,enumerate-daily-packs,enumerate-release-packs,update-cache,resolve-sdk \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            --sdk-channel "${{ inputs.sdk_channel || '12.0' }}" \
            ${{ inputs.sdk_version && format('--sdk-version "{0}"', inputs.sdk_version) || '' }} \
            ${{ inputs.runtime_commit && format('--runtime-commit "{0}"', inputs.runtime_commit) || '' }} \
            ${{ inputs.runtime_pack && format('--runtime-pack "{0}"', inputs.runtime_pack) || '' }} \
            ${{ inputs.runtime_pr && format('--runtime-pr "{0}"', inputs.runtime_pr) || '' }} \
            ${{ inputs.runtime_repo && format('--runtime-repo "{0}"', inputs.runtime_repo) || '' }} \
            ${{ inputs.aspnetcore_commit && format('--aspnetcore-commit "{0}"', inputs.aspnetcore_commit) || '' }} \
            ${{ inputs.aspnetcore_pr && format('--aspnetcore-pr "{0}"', inputs.aspnetcore_pr) || '' }} \
            ${{ inputs.aspnetcore_repo && format('--aspnetcore-repo "{0}"', inputs.aspnetcore_repo) || '' }} \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}

      - name: Read SDK version
        id: sdk-version
        shell: bash
        run: |
          SDK_VERSION=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.sdkInfo?.sdkVersion || '')")
          COMMIT_DATE=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.sdkInfo?.runtimeCommitDateTime?.split('T')[0] || '')")
          COMMIT_MSG=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); const m=c.sdkInfo?.runtimeCommitMessage||''; console.log(m.length>60?m.slice(0,60)+'…':m)")
          RUNTIME_BUILD=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.runtimeBuildRequired ? 'true' : 'false')")
          RUNTIME_COMMIT=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.runtimeCommit || '')")
          RUNTIME_REPO=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.runtimeRepo || 'dotnet/runtime')")
          ASPNETCORE_BUILD=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.aspnetCoreBuildRequired ? 'true' : 'false')")
          ASPNETCORE_COMMIT=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.aspnetCoreCommit || '')")
          ASPNETCORE_REPO=$(node -e "const c=JSON.parse(require('fs').readFileSync('${ARTIFACTS_DIR}/bench-context.json','utf-8')); console.log(c.aspnetCoreRepo || 'dotnet/aspnetcore')")
          echo "sdk-version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "runtime-commit-date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"
          echo "runtime-commit-message=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "runtime-build-required=$RUNTIME_BUILD" >> "$GITHUB_OUTPUT"
          echo "runtime-commit=$RUNTIME_COMMIT" >> "$GITHUB_OUTPUT"
          echo "runtime-repo=$RUNTIME_REPO" >> "$GITHUB_OUTPUT"
          echo "aspnetcore-build-required=$ASPNETCORE_BUILD" >> "$GITHUB_OUTPUT"
          echo "aspnetcore-commit=$ASPNETCORE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "aspnetcore-repo=$ASPNETCORE_REPO" >> "$GITHUB_OUTPUT"
          echo "SDK version: $SDK_VERSION" >&2
          echo "Runtime commit: $COMMIT_DATE $COMMIT_MSG" >&2
          echo "Runtime build required: $RUNTIME_BUILD" >&2
          echo "ASP.NET Core build required: $ASPNETCORE_BUILD" >&2

      # App list drives the per-app build shard matrix; --print-apps is dry-run aware, and a
      # single build-run-id keeps every shard's results/<id>/ path identical for the merge.
      - name: Plan build shards
        id: plan
        shell: bash
        run: |
          APPS=$(npx --prefix bench tsx bench/src/main.ts --print-apps ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }})
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "build-run-id=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"
          echo "Build apps: $APPS" >&2

      - name: Upload bench context
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}/bench-context.json
          if-no-files-found: error
          retention-days: 7

  # ── Job 2a: Build Runtime Mono (only when building from source) ─────────────
  build-runtime-mono:
    name: Build Runtime (Mono)
    needs: resolve
    if: needs.resolve.outputs.runtime-build-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Clone runtime repo
        shell: bash
        run: |
          git clone --no-checkout --filter=blob:none \
            "https://github.com/${{ needs.resolve.outputs.runtime-repo }}.git" runtime-src
          cd runtime-src
          git checkout ${{ needs.resolve.outputs.runtime-commit }}

      - name: Build Mono browser-wasm
        shell: bash
        run: |
          cd runtime-src
          ./build.sh mono+libs -os browser -arch wasm -c Release
          ./build.sh packs.product -os browser -arch wasm -c Release

      - name: Find and extract runtime pack
        id: pack
        shell: bash
        run: |
          NUPKG=$(find runtime-src/artifacts/packages/Release/Shipping \
            -iname 'Microsoft.NETCore.App.Runtime.Mono.browser-wasm.*.nupkg' \
            -print -quit 2>/dev/null || true)
          if [ -z "$NUPKG" ]; then
            NUPKG=$(find runtime-src/artifacts/packages/Release/NonShipping \
              -iname 'Microsoft.NETCore.App.Runtime.Mono.browser-wasm.*.nupkg' \
              -print -quit 2>/dev/null || true)
          fi
          if [ -z "$NUPKG" ]; then
            echo "ERROR: Mono runtime pack nupkg not found" >&2
            exit 1
          fi
          echo "Found nupkg: $NUPKG" >&2
          mkdir -p runtime-pack-mono
          unzip -o "$NUPKG" -d runtime-pack-mono

      - name: Upload runtime pack
        uses: actions/upload-artifact@v7
        with:
          name: runtime-pack-mono
          path: runtime-pack-mono/
          retention-days: 3

  # ── Job 2b: Build Runtime CoreCLR (only when building from source) ─────────
  build-runtime-coreclr:
    name: Build Runtime (CoreCLR)
    needs: resolve
    if: needs.resolve.outputs.runtime-build-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Clone runtime repo
        shell: bash
        run: |
          git clone --no-checkout --filter=blob:none \
            "https://github.com/${{ needs.resolve.outputs.runtime-repo }}.git" runtime-src
          cd runtime-src
          git checkout ${{ needs.resolve.outputs.runtime-commit }}

      - name: Build CoreCLR browser-wasm
        shell: bash
        run: |
          cd runtime-src
          ./build.sh clr+libs -os browser -arch wasm -c Release

      - name: Find and extract runtime pack
        id: pack
        shell: bash
        run: |
          NUPKG=$(find runtime-src/artifacts/packages/Release/Shipping \
            -iname 'Microsoft.NETCore.App.Runtime.browser-wasm.*.nupkg' \
            ! -iname '*Mono*' \
            -print -quit 2>/dev/null || true)
          if [ -z "$NUPKG" ]; then
            NUPKG=$(find runtime-src/artifacts/packages/Release/NonShipping \
              -iname 'Microsoft.NETCore.App.Runtime.browser-wasm.*.nupkg' \
              ! -iname '*Mono*' \
              -print -quit 2>/dev/null || true)
          fi
          if [ -z "$NUPKG" ]; then
            echo "ERROR: CoreCLR runtime pack nupkg not found" >&2
            exit 1
          fi
          echo "Found nupkg: $NUPKG" >&2
          mkdir -p runtime-pack-coreclr
          unzip -o "$NUPKG" -d runtime-pack-coreclr

      - name: Upload runtime pack
        uses: actions/upload-artifact@v7
        with:
          name: runtime-pack-coreclr
          path: runtime-pack-coreclr/
          retention-days: 3

  # ── Job 2c: Build ASP.NET Core (only when building from source) ─────────────
  build-aspnetcore:
    name: Build ASP.NET Core
    needs: resolve
    if: needs.resolve.outputs.aspnetcore-build-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Clone aspnetcore repo
        shell: bash
        run: |
          git clone --no-checkout --filter=blob:none \
            "https://github.com/${{ needs.resolve.outputs.aspnetcore-repo }}.git" aspnetcore-src
          cd aspnetcore-src
          git checkout ${{ needs.resolve.outputs.aspnetcore-commit }}
          git submodule update --init --recursive

      - name: Restore
        shell: bash
        run: |
          cd aspnetcore-src
          ./restore.sh

      - name: Build
        shell: bash
        run: |
          cd aspnetcore-src
          source activate.sh
          ./eng/build.sh -NoBuildNative -NoBuildJava -NoBuildInstallers -c Release -bl

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p aspnetcore-packages
          cp aspnetcore-src/artifacts/packages/Release/Shipping/*.nupkg aspnetcore-packages/ 2>/dev/null || true
          cp aspnetcore-src/artifacts/packages/Release/NonShipping/*.nupkg aspnetcore-packages/ 2>/dev/null || true
          echo "Collected $(ls aspnetcore-packages/*.nupkg 2>/dev/null | wc -l) packages" >&2
          ls aspnetcore-packages/ | head -20 >&2

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: aspnetcore-packages
          path: aspnetcore-packages/
          retention-days: 3

  # ── Job 3: Build apps (one shard per app, in parallel) ─────────────────────
  build:
    name: Build ${{ matrix.app }} (${{ needs.resolve.outputs.sdk-version }})
    needs: [resolve, build-runtime-mono, build-runtime-coreclr, build-aspnetcore]
    if: |
      always()
      && needs.resolve.result == 'success'
      && (needs.build-runtime-mono.result == 'success' || needs.build-runtime-mono.result == 'skipped')
      && (needs.build-runtime-coreclr.result == 'success' || needs.build-runtime-coreclr.result == 'skipped')
      && (needs.build-aspnetcore.result == 'success' || needs.build-aspnetcore.result == 'skipped')
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io/blazor-playground/macro-benchmarks' }}/browser-bench-build:latest
    permissions:
      contents: write
      packages: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.resolve.outputs.apps) }}
    env:
      BENCH_RUN_ID: ${{ needs.resolve.outputs.build-run-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download Mono runtime pack (if built from source)
        if: needs.resolve.outputs.runtime-build-required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: runtime-pack-mono
          path: ${{ env.ARTIFACTS_DIR }}/runtime-pack-mono

      - name: Download CoreCLR runtime pack (if built from source)
        if: needs.resolve.outputs.runtime-build-required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: runtime-pack-coreclr
          path: ${{ env.ARTIFACTS_DIR }}/runtime-pack-coreclr

      - name: Download ASP.NET Core packages (if built from source)
        if: needs.resolve.outputs.aspnetcore-build-required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: aspnetcore-packages
          path: ${{ env.ARTIFACTS_DIR }}/aspnetcore-packages

      - name: Build app
        shell: bash
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages check-out-tracking,download-sdk,build-runtime,build-aspnetcore,build \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            --app "${{ matrix.app }}" \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}

      - name: Pin artifact root
        shell: bash
        run: |
          # Keep the {runtime}/{label}/{preset} structure even for a single built cell.
          if [ -d "${ARTIFACTS_DIR}/publish/${{ matrix.app }}" ]; then
            touch "${ARTIFACTS_DIR}/publish/${{ matrix.app }}/.keep"
          fi

      - name: Upload build (${{ matrix.app }})
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.app }}
          path: ${{ env.ARTIFACTS_DIR }}/publish/${{ matrix.app }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload partial manifest (${{ matrix.app }})
        uses: actions/upload-artifact@v7
        with:
          name: build-manifest-${{ matrix.app }}
          path: ${{ env.ARTIFACTS_DIR }}/results/${{ env.BENCH_RUN_ID }}/build-manifest.json
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 3b: Collect build manifests + generate the measure matrix ──────────
  build-collect:
    name: Collect builds (${{ needs.resolve.outputs.sdk-version }})
    needs: [resolve, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io/blazor-playground/macro-benchmarks' }}/browser-bench-build:latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      BENCH_RUN_ID: ${{ needs.resolve.outputs.build-run-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download partial manifests
        uses: actions/download-artifact@v8
        with:
          pattern: build-manifest-*
          path: ${{ env.ARTIFACTS_DIR }}/manifests

      - name: Merge manifests into context + results
        shell: bash
        run: |
          RESULTS="${ARTIFACTS_DIR}/results/${BENCH_RUN_ID}"
          mkdir -p "$RESULTS"
          # Concatenate every shard's build-manifest.json into one, and fold it back into
          # bench-context (measure reads ctx.buildManifest/runId/resultsDir from there).
          node --input-type=module -e "
            import { readFileSync, writeFileSync, readdirSync, existsSync, statSync } from 'node:fs';
            const mdir = '${ARTIFACTS_DIR}/manifests';
            const find = (dir) => readdirSync(dir).flatMap(e => {
              const p = dir + '/' + e;
              return statSync(p).isDirectory() ? find(p) : (e === 'build-manifest.json' ? [p] : []);
            });
            let cells = [];
            if (existsSync(mdir)) {
              for (const f of find(mdir)) cells = cells.concat(JSON.parse(readFileSync(f, 'utf-8')));
            }
            const results = '${RESULTS}';
            writeFileSync(results + '/build-manifest.json', JSON.stringify(cells, null, 2) + '\n');
            const ctxPath = '${ARTIFACTS_DIR}/bench-context.json';
            const ctx = JSON.parse(readFileSync(ctxPath, 'utf-8'));
            ctx.buildManifest = cells;
            ctx.runId = '${BENCH_RUN_ID}';
            ctx.resultsDir = results;
            writeFileSync(ctxPath, JSON.stringify(ctx, null, 2) + '\n');
            console.error('Merged ' + cells.length + ' cells');
          "
          echo "${BENCH_RUN_ID}" > "${ARTIFACTS_DIR}/results/.run-id"

      - name: Set matrix output
        id: matrix
        shell: bash
        run: |
          MANIFEST="${ARTIFACTS_DIR}/results/${BENCH_RUN_ID}/build-manifest.json"
          CELLS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$MANIFEST','utf-8')).length)" 2>/dev/null || echo 0)
          if [ "$CELLS" = "0" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "⚠ No build manifest cells" >&2
            exit 0
          fi
          # Extract {app, preset, runtime} for the GHA matrix, crossed with up to 2 replica
          # nodes (independent runners → less machine/VM noise). arm64 runners are a single
          # homogeneous SKU (between-machine CV ~1-3%), so 2 replicas suffice. GitHub caps a
          # matrix at 256 jobs, so the replica count is auto-reduced to fit if ever needed.
          # Kestrel-hosted apps (blazor-perf) run a native server-side .NET process built on
          # amd64, so they must measure on amd64; WASM apps are arch-neutral → arm64.
          MATRIX=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const m = JSON.parse(readFileSync('$MANIFEST', 'utf-8'));
            const DESIRED = 2, MAX_MATRIX = 256;
            const nReps = Math.max(1, Math.min(DESIRED, Math.floor(MAX_MATRIX / Math.max(1, m.length))));
            const reps = Array.from({ length: nReps }, (_, i) => i + 1);
            const runnerFor = (app) => app === 'blazor-perf' ? 'ubuntu-latest' : 'ubuntu-24.04-arm';
            console.error('replicas=' + nReps + ' base=' + m.length + ' jobs=' + (nReps * m.length));
            console.log(JSON.stringify(m.flatMap(e => reps.map(r => ({ app: e.app, preset: e.preset, runtime: e.runtime, replica: r, runner: runnerFor(e.app) })))));
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $MATRIX" >&2

      - name: Upload bench context
        uses: actions/upload-artifact@v7
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}/bench-context.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: build-results
          path: ${{ env.ARTIFACTS_DIR }}/results/
          if-no-files-found: error
          retention-days: 7

  # ── Job 4: Measure (matrix: app × preset × runtime × replica) ──────────────
  measure:
    name: Measure ${{ matrix.app }}/${{ matrix.preset }}/${{ matrix.runtime }} r${{ matrix.replica }}
    needs: [resolve, build-collect]
    if: |
      !cancelled()
      && needs.build-collect.result == 'success'
      && needs.build-collect.outputs.matrix != '[]'
      && needs.build-collect.outputs.matrix != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io/blazor-playground/macro-benchmarks' }}/browser-bench-measure:latest
      options: --user 1001
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-collect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Symlink pre-installed node_modules into workspace
        shell: bash
        run: entrypoint.sh true

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: build-results
          path: ${{ env.ARTIFACTS_DIR }}/results

      - name: Download build (${{ matrix.app }})
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.app }}
          path: ${{ env.ARTIFACTS_DIR }}/publish/${{ matrix.app }}

      - name: Validate downloaded artifacts
        shell: bash
        run: |
          if [ ! -f "${ARTIFACTS_DIR}/bench-context.json" ]; then
            echo "::error::bench-context.json not found after artifact download"
            exit 1
          fi
          if [ ! -d "${ARTIFACTS_DIR}/publish" ] || [ -z "$(ls -A "${ARTIFACTS_DIR}/publish")" ]; then
            echo "::error::Build artifacts directory is empty or missing"
            exit 1
          fi
          echo "Artifacts validated: context and publish dir present"

      - name: Run measurements
        shell: bash
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages measure \
            --verbose \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            --app "${{ matrix.app }}" \
            --preset "${{ matrix.preset }}" \
            --runtime "${{ matrix.runtime }}" \
            --replica "${{ matrix.replica }}" \
            --cold-runs 4 \
            --warm-runs 3 \
            --walkthrough-runs 5 \
            --retries 3 \
            --timeout 600000 \
            --deadline-minutes 160 \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.app }}-${{ matrix.preset }}-${{ matrix.runtime }}-r${{ matrix.replica }}
          path: ${{ env.ARTIFACTS_DIR }}/results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 5: Aggregate results and update views ──────────────────────────────
  aggregate:
    name: Aggregate
    needs: [resolve, build-collect, measure]
    if: always() && needs.measure.result == 'success'
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io/blazor-playground/macro-benchmarks' }}/browser-bench-build:latest
    permissions:
      contents: write
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Symlink pre-installed node_modules into workspace
        shell: bash
        run: entrypoint.sh true

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download build results
        uses: actions/download-artifact@v8
        with:
          name: build-results
          path: ${{ env.ARTIFACTS_DIR }}/results

      - name: Download all measurement results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: ${{ env.ARTIFACTS_DIR }}/results
          merge-multiple: true

      - name: List collected results
        shell: bash
        run: find "${ARTIFACTS_DIR}/results" -name '*.json' | head -150 || true

      - name: Transform and update views
        shell: bash
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages transform-views,update-views \
            --verbose \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}

      - name: Upload final results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-results
          path: ${{ env.ARTIFACTS_DIR }}/results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 5: Schedule untested SDK versions ──────────────────────────────────
  schedule:
    name: Schedule
    needs: [resolve, aggregate]
    if: always() && needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    container: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io/blazor-playground/macro-benchmarks' }}/browser-bench-build:latest
    permissions:
      contents: write
      actions: write
      packages: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Export container env to GitHub Actions
        shell: bash
        run: echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-artifacts}" >> "$GITHUB_ENV"

      - name: Symlink pre-installed node_modules into workspace
        shell: bash
        run: entrypoint.sh true

      - name: Download bench context
        uses: actions/download-artifact@v8
        with:
          name: bench-context
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Run schedule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --prefix bench tsx bench/src/main.ts \
            --stages check-out-tracking,schedule \
            --context "${ARTIFACTS_DIR}/bench-context.json" \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--dry-run' || '' }}
