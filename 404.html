    <script>
        // GitHub Pages cannot serve Blazor routes; bootstrap from the project root.
        const path = window.location.pathname + window.location.search + window.location.hash;

        entry.searchParams.set('redirect', path);
        window.location.replace(entry.href);
    </script>
