<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script type="text/javascript" src="./package_63ca97fb6c0130c48c11b6e0cd2db8a290d186e8/require.js"></script>
    <script type="module" src="./package_63ca97fb6c0130c48c11b6e0cd2db8a290d186e8/uno-bootstrap.js"></script>
    <link rel="stylesheet" type="text/css" href="./package_63ca97fb6c0130c48c11b6e0cd2db8a290d186e8/normalize.css" />
<link rel="stylesheet" type="text/css" href="./package_63ca97fb6c0130c48c11b6e0cd2db8a290d186e8/uno-bootstrap.css" />
<link rel="stylesheet" type="text/css" href="./package_63ca97fb6c0130c48c11b6e0cd2db8a290d186e8/uno.css" />
<link rel="stylesheet" type="text/css" href="./package_63ca97fb6c0130c48c11b6e0cd2db8a290d186e8/Fonts.css" />
    
    <script type='module'>
        globalThis.js_loaded = performance.now();
        globalThis.onConsole = [];
        globalThis.console.logOriginal = globalThis.console.log;
        globalThis.console.log = (...args) => {
            for (const handler of globalThis.onConsole) {
                handler(...args);
            }
            globalThis.console.logOriginal(...args);
        };
    </script>
</head>

<body>
    <div id="uno-body" class="container-fluid uno-body">
        <div class="uno-loader" loading-position="bottom" loading-alert="none">

            <!-- Logo: change src to customize the logo -->
            <img class="logo" src="" title="Uno is loading your application" />

            <progress></progress>
            <span class="alert"></span>
        </div>
    </div>
    <noscript>
        <p>This application requires Javascript and WebAssembly to be enabled.</p>
    </noscript>
</body>

</html>
