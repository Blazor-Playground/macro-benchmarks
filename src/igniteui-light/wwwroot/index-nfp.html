<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>igniteui-light</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="IgniteUILight.styles.css" />
    <link rel="stylesheet" href="_content/IgniteUI.Blazor/themes/light/fluent.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body class="ig-typography">
    <div id="app">
        <div class="loading-screen">
            <svg class="loading-progress" viewBox="0 0 100 100">
                <circle class="loading-track" r="42" cx="50" cy="50" />
                <g class="loading-spinner">
                    <circle class="loading-indicator" r="42" cx="50" cy="50" />
                </g>
            </svg>
            <div class="loading-progress-text">Loading</div>
        </div>
    </div>
    <script src="_content/IgniteUI.Blazor/app.bundle.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="main.mjs" type="module"></script>
</body>

</html>
